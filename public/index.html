<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>AU Price Tracker</title>
</head>
<body class="bg-gray-100">
  <div class="max-w-xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">AU Price Tracker</h1>
    <form id="addForm" class="flex gap-2 mb-4">
      <input id="urlInput" class="flex-1 p-2 rounded border" placeholder="Paste product URL"/>
      <input id="targetInput" type="number" step="0.01" class="w-28 p-2 rounded border" placeholder="Target $"/>
      <button class="bg-blue-600 text-white px-4 rounded">Track</button>
    </form>
    <div id="products" class="space-y-4"></div>

    <h2 class="text-xl mt-8 mb-2">Comparison Table</h2>
    <div id="compareTable"></div>
  </div>
  <script type="module" src="./comparison.js"></script>
  <script>
    const addForm=document.getElementById('addForm');
    const productsDiv=document.getElementById('products');
    addForm.addEventListener('submit',async e=>{
      e.preventDefault();
      const url=urlInput.value.trim();
      const target=parseFloat(targetInput.value)||null;
      if(!url)return;
      const res=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({url,target})});
      const data=await res.json();
      loadProducts();
    });
    async function loadProducts(){
      const res=await fetch('/api/products');
      const data=await res.json();
      productsDiv.innerHTML=data.map(p=>\`<div class="p-3 bg-white rounded shadow">
          <div class="font-semibold">\${p.title||p.url}</div>
          <div>Current: \$\${p.price?.toFixed(2)||'--'} \${p.target?('/ Target '+p.target):''}</div>
      </div>\`).join('');
    }
    loadProducts();

    // web push subscription
    (async ()=>{
      const config=await (await fetch('/api/config')).json();
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.register('/sw.js');
        const sub=await reg.pushManager.getSubscription()||
          await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:config.vapidPublicKey});
        await fetch('/api/subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});
      }
    })();
  </script>
</body>
</html>
